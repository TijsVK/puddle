# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-about: third-party notices for the bundled msb.exe, run on the fork tag's source
# (`cargo xtask runtime`). Attribution only: msb's own deny.toml decides what msb may use. The list
# is msb's allow list plus the licences its tree is known to carry (aws-lc: OpenSSL, webpki-roots:
# CDLA-Permissive-2.0).
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "Unlicense",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
