[package]
name = "puddle-api"
description = "Local HTTP API (axum) with SSE and the generated OpenAPI contract (W4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
puddle-settings = { workspace = true }
puddle-store = { workspace = true }
puddle-types = { workspace = true, features = ["openapi"] }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
