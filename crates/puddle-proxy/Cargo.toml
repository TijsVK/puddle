# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-proxy"
description = "puddle's egress proxy: CONNECT/HTTP handling, pending requests, TLS termination of bound hosts with a credential injection hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
getrandom = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
puddle-agent-proto = { workspace = true }
puddle-ca = { workspace = true }
puddle-ipc = { workspace = true }
puddle-netpolicy = { workspace = true }
puddle-types = { workspace = true }
puddle-upstream = { workspace = true }
rustls = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }

[features]
# `testing`: in-memory policy, resolver and allow-any address check for tests (never in product code).
testing = []

[dev-dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
proptest = { workspace = true }
puddle-proxy = { path = ".", features = ["testing"] }
puddle-upstream = { workspace = true, features = ["testing"] }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
