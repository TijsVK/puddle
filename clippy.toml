# Tests may unwrap, expect, panic and index: a panic is how a test fails.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Names from the Windows proxy stack that doc-markdown would want in backticks (T-134).
doc-valid-idents = ["WinINet", "WinHTTP", "WPAD", "PoC", "NTLM", "SSPI", ".."]
