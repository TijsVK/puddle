# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Tijs van Kampen <puddle@tijsvankampen.be>"]
repository = "https://github.com/TijsVK/puddle"
publish = false

[workspace.dependencies]
# Internal crates. Add external dependencies here too, with a version, and use
# `dep = { workspace = true }` in the member crates, so every crate gets the same version.
puddle-types = { path = "crates/puddle-types" }
puddle-compute = { path = "crates/puddle-compute" }
puddle-proxy = { path = "crates/puddle-proxy" }
puddle-store = { path = "crates/puddle-store" }
puddle-api = { path = "crates/puddle-api" }
puddle-boot = { path = "crates/puddle-boot" }
puddle-agent = { path = "crates/puddle-agent" }
puddle-agent-proto = { path = "crates/puddle-agent-proto" }
puddle-runtime = { path = "crates/puddle-runtime" }
puddle-ipc = { path = "crates/puddle-ipc" }
puddle-settings = { path = "crates/puddle-settings" }
puddle-netpolicy = { path = "crates/puddle-netpolicy" }
puddle-ca = { path = "crates/puddle-ca" }

# External
object = { version = "0.40", default-features = false }
# msb SDK, exact pin: the SDK and the bundled runtime move together (D-19). Default features
# off: no build-time runtime download, no keyring/dbus, no cloud client. `net` is required even
# without guest networking: without it the SDK's launch config lacks `sandbox_slot` and a release
# msb refuses it ("missing field `sandbox_slot`", T-102).
microsandbox = { version = "=0.7.7", default-features = false, features = ["local", "net"] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
proptest = { version = "1.11", default-features = false, features = ["std"] }
psl = "2.1"
# UTS #46 host-name mapping (IDNA to ASCII) for the proxy's name normalisation (T-132).
idna = "1.1"
rusqlite = { version = "0.39", features = ["bundled"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.52", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# Guest agent and its protocol (T-111). tokio-yamux multiplexes guest connections over a few
# vsock streams (a Windows vsock route tops out around 100 streams); libc for AF_VSOCK.
tokio-yamux = { version = "0.3.20", default-features = false, features = ["tokio-timer"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
libc = "0.2.172"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
getrandom = "0.4"
windows-sys = "0.61"
# Per-sandbox CA and leaf certificates (T-133). ring, not aws-lc-rs: aws-lc-sys carries the
# OpenSSL licence, which deny.toml does not allow; ring is Apache-2.0 AND ISC.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
time = { version = "0.3", default-features = false, features = ["std"] }
# OpenAPI schemas for the API's wire types (T-137, ADR 0004).
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
# Local HTTP API (T-137): axum on loopback; utoipa-axum registers routes and spec together.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "macros", "query", "tokio", "tracing"] }
# Served through hyper directly (not `axum::serve`) for a header-read timeout and owned connection tasks.
hyper = { version = "1.11", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
utoipa-axum = "0.3.0"
tower-http = { version = "0.7.1", default-features = false, features = ["timeout"] }
subtle = { version = "2.6.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny" # each crate root also says #![forbid(unsafe_code)] unless it needs FFI
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction lints picked for a security tool written mostly by agents.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
mem_forget = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
wildcard_dependencies = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
