# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Tijs van Kampen <puddle@tijsvankampen.be>"]
repository = "https://github.com/TijsVK/puddle"
publish = false

[workspace.dependencies]
# Internal crates. Add external dependencies here too, with a version, and use
# `dep = { workspace = true }` in the member crates, so every crate gets the same version.
puddle-types = { path = "crates/puddle-types" }
puddle-compute = { path = "crates/puddle-compute" }
puddle-proxy = { path = "crates/puddle-proxy" }
puddle-store = { path = "crates/puddle-store" }
puddle-api = { path = "crates/puddle-api" }
puddle-boot = { path = "crates/puddle-boot" }
puddle-agent = { path = "crates/puddle-agent" }
puddle-agent-proto = { path = "crates/puddle-agent-proto" }
puddle-runtime = { path = "crates/puddle-runtime" }
puddle-ipc = { path = "crates/puddle-ipc" }
puddle-compute-msb = { path = "crates/puddle-compute-msb" }
puddle-vm-tests = { path = "crates/puddle-vm-tests" }
puddle-settings = { path = "crates/puddle-settings" }
puddle-netpolicy = { path = "crates/puddle-netpolicy" }
puddle-ca = { path = "crates/puddle-ca" }
puddle-guest-env = { path = "crates/puddle-guest-env" }
puddle-ssh = { path = "crates/puddle-ssh" }
puddle-certs = { path = "crates/puddle-certs" }
puddle-workspace = { path = "crates/puddle-workspace" }
puddle-doctor = { path = "crates/puddle-doctor" }
puddle-lifecycle = { path = "crates/puddle-lifecycle" }
puddle-upstream = { path = "crates/puddle-upstream" }
puddle-fs = { path = "crates/puddle-fs" }

# External
# msb SDK from puddle's fork, tag `v<release>-puddle.N`. The SDK and the bundled runtime
# move together: `puddle-runtime` reads its expected runtime version from this pin in
# Cargo.lock, and the CI VM jobs and `cargo xtask runtime` read the tag from there too
# (`ci/msb-tag.sh`), so the three `tag =` values below are the only place the version is written.
# To bump: change the tag on the three lines (the same string), update the libkrun/russh `rev`s in
# `[patch.crates-io]` to the commits the new tag's Cargo.lock pins, add the tag's checksums to
# `ci/msb-runtime.sha256`, then `cargo update -p microsandbox`.
# Default features off: no build-time runtime download, no keyring/dbus, no cloud client. `net` is
# required even without guest networking: without it the SDK's launch config lacks `sandbox_slot`
# and a release msb refuses it ("missing field `sandbox_slot`"). `ssh` for the in-process
# SSH server.
microsandbox = { git = "https://github.com/TijsVK/microsandbox", tag = "v0.7.7-puddle.8", default-features = false, features = ["local", "net", "ssh"] }
# The SDK's image crate: the SDK has no public "pull without creating" call.
microsandbox-image = { git = "https://github.com/TijsVK/microsandbox", tag = "v0.7.7-puddle.8", default-features = false }
# Only for building the SDK's boot error in tests.
microsandbox-runtime = { git = "https://github.com/TijsVK/microsandbox", tag = "v0.7.7-puddle.8", default-features = false }
object = { version = "0.40", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
rust-embed = { version = "8.12", default-features = false, features = ["mime-guess"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
psl = "2.1"
# UTS #46 host-name mapping (IDNA to ASCII) for the proxy's name normalisation.
idna = "1.1"
rusqlite = { version = "0.39", features = ["bundled"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.52", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# Guest agent and its protocol. tokio-yamux multiplexes guest connections over a few
# vsock streams (a Windows vsock route tops out around 100 streams); libc for AF_VSOCK.
tokio-yamux = { version = "0.3.20", default-features = false, features = ["tokio-timer"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
libc = "0.2.172"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
getrandom = "0.4"
# The per-user data folder per OS; no own per-OS code for it.
dirs = "7"
windows-sys = "0.61"
# Per-sandbox CA and leaf certificates. ring, not aws-lc-rs: aws-lc-sys carries the
# OpenSSL licence, which deny.toml does not allow; ring is Apache-2.0 AND ISC.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
time = { version = "0.3", default-features = false, features = ["std"] }
# PEM for the guest CA bundle; already in the tree through rcgen.
pem = { version = "4", default-features = false, features = ["std"] }
# OpenAPI schemas for the API's wire types (ADR 0004).
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
# Local HTTP API: axum on loopback; utoipa-axum registers routes and spec together.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "macros", "query", "tokio", "tracing"] }
# Served through hyper directly (not `axum::serve`) for a header-read timeout and owned connection tasks.
hyper = { version = "1.11", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
utoipa-axum = "0.3.0"
tower-http = { version = "0.7.1", default-features = false, features = ["timeout"] }
subtle = { version = "2.6.1", default-features = false, features = ["std"] }
# Basic credentials of the image-pull proxy; already in the tree through reqwest.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# Test-only: the lab registry of the image-pull test. Both already in the tree; ring, not
# aws-lc-rs (see rcgen).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tar = { version = "0.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny" # each crate root also says #![forbid(unsafe_code)] unless it needs FFI
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction lints picked for a security tool written mostly by agents.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
mem_forget = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
wildcard_dependencies = "warn"

# The msb fork's own `[patch.crates-io]` doesn't reach puddle (patches apply only in the root
# workspace), so its libkrun and russh forks are repeated here, pinned by `rev` to the commits the
# fork tag's Cargo.lock pins (a branch would follow later pushes, which the tag's msb wasn't built
# with). libkrun: TijsVK/libkrun `puddle` (msb_krun 0.1.41 + fixes); russh: TijsVK/russh
# `puddle-0.63.3` (peer-close fix).
[patch.crates-io]
msb_krun = { git = "https://github.com/TijsVK/libkrun", rev = "bdf711f0c7ec5117b70c697282c61943fca36ee7" }
msb_krun_arch = { git = "https://github.com/TijsVK/libkrun", rev = "bdf711f0c7ec5117b70c697282c61943fca36ee7" }
msb_krun_arch_gen = { git = "https://github.com/TijsVK/libkrun", rev = "bdf711f0c7ec5117b70c697282c61943fca36ee7" }
msb_krun_cpuid = { git = "https://github.com/TijsVK/libkrun", rev = "bdf711f0c7ec5117b70c697282c61943fca36ee7" }
msb_krun_devices = { git = "https://github.com/TijsVK/libkrun", rev = "bdf711f0c7ec5117b70c697282c61943fca36ee7" }
msb_krun_hvf = { git = "https://github.com/TijsVK/libkrun", rev = "bdf711f0c7ec5117b70c697282c61943fca36ee7" }
msb_krun_kernel = { git = "https://github.com/TijsVK/libkrun", rev = "bdf711f0c7ec5117b70c697282c61943fca36ee7" }
msb_krun_polly = { git = "https://github.com/TijsVK/libkrun", rev = "bdf711f0c7ec5117b70c697282c61943fca36ee7" }
msb_krun_smbios = { git = "https://github.com/TijsVK/libkrun", rev = "bdf711f0c7ec5117b70c697282c61943fca36ee7" }
msb_krun_utils = { git = "https://github.com/TijsVK/libkrun", rev = "bdf711f0c7ec5117b70c697282c61943fca36ee7" }
msb_krun_vmm = { git = "https://github.com/TijsVK/libkrun", rev = "bdf711f0c7ec5117b70c697282c61943fca36ee7" }
russh = { git = "https://github.com/TijsVK/russh", rev = "b7e6012432378bf7662167d17ce00a152ab33d0d" }

[profile.release]
lto = "thin"
codegen-units = 1
