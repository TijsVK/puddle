# SPDX-License-Identifier: GPL-3.0-or-later
# VM tests on Linux KVM (tier K): crate puddle-vm-tests under `nextest --profile vm`, real
# msb microVMs on the hosted runner. Runner time is shared (docs/STANDARDS.md, "CI"), so this runs
# by hand on any branch (`gh workflow run vm-linux.yml --ref <branch>`) and nightly on develop unless
# it already has a green run on that commit. VM tests are never retried; a runner without
# KVM is reported as an infrastructure skip, not a test result.
# The test binaries are built once (`cargo nextest archive`) and the tests run in three partitions
# on three runners at once; `vm-linux (KVM, msb microVMs)` is the one result of all of them.
name: vm-linux

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      parallel_runs:
        description: "Test runs at once on each partition's runner, each with its own prefix and msb home (1-3)"
        default: "1"
        type: choice
        options: ["1", "2", "3"]

permissions:
  contents: read

concurrency:
  group: vm-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables only: backtraces keep file:line, builds and the cache stay much smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Crates with VM tests: the harness smoke, the msb adapter (contract suite, HG-01/02, memory),
  # the boot hook, the workspace lifecycle, shutdown and reconcile, the whole host.
  VM_CRATES: -p puddle-vm-tests -p puddle-compute-msb -p puddle-boot -p puddle-workspace -p puddle-lifecycle -p puddle-host
  # msb's sandbox runtimes log at debug, and the harness keeps each removed sandbox's logs beside
  # the run home, so a boot that fails keeps its VMM trace and kernel.log in the artefact.
  PUDDLE_VM_MSB_LOG_LEVEL: debug

jobs:
  build:
    name: vm-linux build (test archive, guest agent)
    # `actions: read` for ci/should-run.sh (a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh vm-linux.yml
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changed.outputs.run == 'true'
        with:
          key: vm
          cache-on-failure: true
          # Only develop saves (10 GB cap for the whole repo); other refs restore it.
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        if: steps.changed.outputs.run == 'true'
        with:
          tool: cargo-nextest@0.9.146
      # The runtime is built from source on a cache miss (about 10 minutes). Doing that here, once,
      # saves the msb entry for the three test jobs, which start after this job ends.
      - name: msb build cache
        id: msb-cache
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msb-build/msb-*
          key: msb-linux-${{ hashFiles('ci/msb-runtime.sha256', 'ci/fetch-msb.sh', 'rust-toolchain.toml') }}
      - name: msb runtime (fork tag; build on a cache miss, to fill the cache)
        if: steps.changed.outputs.run == 'true' && steps.msb-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libcap-ng-dev
          MSB_BUILD_DIR="$RUNNER_TEMP/msb-build" ci/fetch-msb.sh "$RUNNER_TEMP/msb"
      - name: guest agent (static musl build)
        if: steps.changed.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          cp "$(ci/build-agent.sh --locked)" "$RUNNER_TEMP/bundle/puddle-agent"
      - name: build the VM tests once (nextest archive)
        if: steps.changed.outputs.run == 'true'
        run: cargo nextest archive $VM_CRATES --profile vm --locked --archive-file "$RUNNER_TEMP/bundle/vm-tests.tar.zst"
      - name: share the archive and the agent with the test jobs
        if: steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-linux-build
          path: ${{ runner.temp }}/bundle
          retention-days: 1
          compression-level: 0 # the archive is already compressed

  tests:
    name: vm-linux tests (partition ${{ matrix.partition }} of 3)
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # ~67 VM tests in all, each partition a third of them; every test has its own 12-minute cap.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: KVM preflight (infrastructure)
        id: kvm
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::warning title=vm-linux skipped::/dev/kvm is missing on this runner; VM tests did not run (infrastructure, not a test result)"
            echo "### vm-linux partition ${{ matrix.partition }}: SKIPPED, no /dev/kvm on the runner (infrastructure)" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Hosted runners ship /dev/kvm root-only; open it to the runner user.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sleep 1
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        if: steps.kvm.outputs.ok == 'true'
        with:
          tool: cargo-nextest@0.9.146
      # The runtime is the SDK's fork tag (ci/msb-tag.sh, from Cargo.lock). The fork releases no
      # Linux msb, so fetch-msb.sh builds it from the tag's pinned commit; the cache keeps only the
      # resulting binary, keyed on the pins and the script (the build job fills it).
      - name: msb build cache
        if: steps.kvm.outputs.ok == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msb-build/msb-*
          key: msb-linux-${{ hashFiles('ci/msb-runtime.sha256', 'ci/fetch-msb.sh', 'rust-toolchain.toml') }}
      - name: msb runtime (fork tag; download, verify, build)
        if: steps.kvm.outputs.ok == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libcap-ng-dev
          MSB_BUILD_DIR="$RUNNER_TEMP/msb-build" ci/fetch-msb.sh "$RUNNER_TEMP/msb"
          echo "PUDDLE_VM_RUNTIME_DIR=$RUNNER_TEMP/msb" >> "$GITHUB_ENV"
          echo "PUDDLE_VM_ROOT=$RUNNER_TEMP/pvm" >> "$GITHUB_ENV"
      - name: the test archive and the guest agent from the build job
        if: steps.kvm.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-linux-build
          path: ${{ runner.temp }}/bundle
      - name: VM tests (tier K, partition ${{ matrix.partition }} of 3)
        if: steps.kvm.outputs.ok == 'true'
        env:
          RUNS: ${{ inputs.parallel_runs || '1' }}
        run: |
          chmod +x "$RUNNER_TEMP/bundle/puddle-agent"
          export PUDDLE_AGENT_BIN="$RUNNER_TEMP/bundle/puddle-agent"
          # cargo-nextest is called directly: through `cargo` it would make rustup install the
          # pinned toolchain here, which an archive run never needs.
          # Real-machine tests (vm_machine_*) run in ci/windows-e2e.ps1, not here. Each run gets its
          # own prefix, so its sandbox names and private msb home never meet another run's.
          base="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          nextest() {
            PUDDLE_VM_PREFIX="$1" cargo-nextest nextest run --profile vm \
              --archive-file "$RUNNER_TEMP/bundle/vm-tests.tar.zst" \
              --extract-to "$RUNNER_TEMP/vmx" --extract-overwrite --workspace-remap . \
              --partition count:${{ matrix.partition }}/3 \
              -E 'not test(/(^|::)vm_machine_/)'
          }
          if [ "$RUNS" = "1" ]; then
            nextest "$base"
            exit
          fi
          pids=""
          for i in $(seq 1 "$RUNS"); do
            nextest "$base-$i" > "$RUNNER_TEMP/run-$i.log" 2>&1 &
            pids="$pids $!"
          done
          rc=0
          for pid in $pids; do wait "$pid" || rc=1; done
          for i in $(seq 1 "$RUNS"); do
            echo "::group::run $i ($base-$i)"; cat "$RUNNER_TEMP/run-$i.log"; echo "::endgroup::"
          done
          exit "$rc"
      - name: upload test results and msb logs
        if: ${{ !cancelled() && steps.kvm.outputs.ok == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-linux-results-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/vmx/target/nextest/vm/junit.xml
            target/nextest/vm/junit.xml
            ${{ runner.temp }}/pvm/**/logs/**
          retention-days: 14
          if-no-files-found: ignore

  # One stable result for the build and every partition (the name a check can require).
  vm-linux:
    name: vm-linux (KVM, msb microVMs)
    needs: [build, tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: build and every partition passed (or were skipped on purpose)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
