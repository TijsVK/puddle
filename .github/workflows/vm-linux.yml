# SPDX-License-Identifier: GPL-3.0-or-later
# VM tests on Linux KVM (T-032 tier K): crate puddle-vm-tests under `nextest --profile vm`, real
# msb microVMs on the hosted runner. Free minutes are scarce (docs/STANDARDS.md, "CI"), so this runs
# by hand on any branch (`gh workflow run vm-linux.yml --ref <branch>`) and nightly on develop when
# develop moved since the last green nightly. VM tests are never retried (T-032); a runner without
# KVM is reported as an infrastructure skip, not a test result.
name: vm-linux

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      parallel_runs:
        description: "Test runs at once on the one runner, each with its own prefix and msb home (1-3)"
        default: "1"
        type: choice
        options: ["1", "2", "3"]

permissions:
  contents: read

concurrency:
  group: vm-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables only: backtraces keep file:line, builds and the cache stay much smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The msb runtime the tests boot on; its archive checksum is pinned in ci/msb-runtime.sha256.
  MSB_TAG: v0.7.7

jobs:
  changed:
    name: anything new since the last green nightly?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh run list -R "${{ github.repository }}" --workflow vm-linux.yml \
            --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "develop unchanged since the last green nightly ($last); skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  vm-linux:
    name: vm-linux (KVM, msb microVMs)
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # A cold build of the SDK takes ~10 min on windows-2025; the tests have their own 15-minute cap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: KVM preflight (infrastructure)
        id: kvm
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::warning title=vm-linux skipped::/dev/kvm is missing on this runner; VM tests did not run (infrastructure, not a test result)"
            echo "### vm-linux: SKIPPED, no /dev/kvm on the runner (infrastructure)" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Hosted runners ship /dev/kvm root-only; open it to the runner user.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sleep 1
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.kvm.outputs.ok == 'true'
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.kvm.outputs.ok == 'true'
        with:
          key: vm
          cache-on-failure: true
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        if: steps.kvm.outputs.ok == 'true'
        with:
          tool: cargo-nextest@0.9.146
      - name: msb runtime (download, verify, unpack)
        if: steps.kvm.outputs.ok == 'true'
        run: |
          ci/fetch-msb.sh "$MSB_TAG" "$RUNNER_TEMP/msb"
          echo "PUDDLE_VM_RUNTIME_DIR=$RUNNER_TEMP/msb" >> "$GITHUB_ENV"
          echo "PUDDLE_VM_ROOT=$RUNNER_TEMP/pvm" >> "$GITHUB_ENV"
      - name: build the VM tests
        if: steps.kvm.outputs.ok == 'true'
        run: cargo nextest run -p puddle-vm-tests --profile vm --locked --no-run
      - name: VM tests (tier K)
        if: steps.kvm.outputs.ok == 'true'
        timeout-minutes: 15
        env:
          RUNS: ${{ inputs.parallel_runs || '1' }}
        run: |
          # Laptop-only tests (vm_laptop_*) run in ci/windows-e2e.ps1, not here. Each run gets its
          # own prefix, so its sandbox names and private msb home never meet another run's.
          base="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "$RUNS" = "1" ]; then
            PUDDLE_VM_PREFIX="$base" cargo nextest run -p puddle-vm-tests --profile vm --locked \
              -E 'not test(/(^|::)vm_laptop_/)'
            exit
          fi
          pids=""
          for i in $(seq 1 "$RUNS"); do
            PUDDLE_VM_PREFIX="$base-$i" cargo nextest run -p puddle-vm-tests --profile vm --locked \
              -E 'not test(/(^|::)vm_laptop_/)' > "$RUNNER_TEMP/run-$i.log" 2>&1 &
            pids="$pids $!"
          done
          rc=0
          for pid in $pids; do wait "$pid" || rc=1; done
          for i in $(seq 1 "$RUNS"); do
            echo "::group::run $i ($base-$i)"; cat "$RUNNER_TEMP/run-$i.log"; echo "::endgroup::"
          done
          exit "$rc"
      - name: upload test results and msb logs
        if: ${{ !cancelled() && steps.kvm.outputs.ok == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-linux-results
          path: |
            target/nextest/vm/junit.xml
            ${{ runner.temp }}/pvm/**/logs/**
          retention-days: 14
          if-no-files-found: ignore
