# SPDX-License-Identifier: GPL-3.0-or-later
# VM tests on Windows WHP (T-032 tier W): crate puddle-vm-tests under `nextest --profile vm` on the
# hosted windows-2025 runner, whose Hyper-V/WHP runs msb microVMs (T-041: observed, not promised by
# GitHub). Windows runners are the slowest to queue, so this runs by hand on any branch
# (`gh workflow run vm-windows.yml --ref <branch>`) and nightly on develop when develop moved since
# the last green nightly. VM tests are never retried (T-032); a runner without a usable hypervisor
# is reported as an infrastructure skip, not a test result.
name: vm-windows

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables only: backtraces keep file:line, builds and the cache stay much smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Crates with VM tests: the harness smoke, the msb adapter (contract suite, HG-01/02, memory),
  # the boot hook (T-108), the workspace lifecycle (T-112), shutdown and reconcile (T-113).
  VM_CRATES: -p puddle-vm-tests -p puddle-compute-msb -p puddle-boot -p puddle-workspace -p puddle-lifecycle

jobs:
  changed:
    name: anything new since the last green nightly?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh run list -R "${{ github.repository }}" --workflow vm-windows.yml \
            --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "develop unchanged since the last green nightly ($last); skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  vm-windows:
    name: vm-windows (WHP, msb microVMs)
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: windows-2025
    # A cold build of the SDK takes ~10 min on windows-2025; the tests have their own 30-minute cap.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: WHP preflight (infrastructure)
        id: whp
        shell: pwsh
        run: |
          $cs = Get-CimInstance Win32_ComputerSystem
          $whp = (Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform).State
          "HypervisorPresent=$($cs.HypervisorPresent) HypervisorPlatform=$whp"
          if ($cs.HypervisorPresent -and "$whp" -eq 'Enabled') {
            "ok=true" >> $env:GITHUB_OUTPUT
          } else {
            "::warning title=vm-windows skipped::Windows Hypervisor Platform is not usable on this runner (HypervisorPresent=$($cs.HypervisorPresent), HypervisorPlatform=$whp); VM tests did not run (infrastructure, not a test result)"
            "### vm-windows: SKIPPED, WHP not usable on the runner (infrastructure)" >> $env:GITHUB_STEP_SUMMARY
            "ok=false" >> $env:GITHUB_OUTPUT
          }
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.whp.outputs.ok == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.whp.outputs.ok == 'true'
        with:
          key: vm
          cache-on-failure: true
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        if: steps.whp.outputs.ok == 'true'
        with:
          tool: cargo-nextest@0.9.146
      - name: msb runtime (fork tag release assets; download, verify)
        if: steps.whp.outputs.ok == 'true'
        shell: bash
        run: |
          # The runtime is the SDK's fork tag (ci/msb-tag.sh, from Cargo.lock). Unix-style path for
          # the script, Windows-style for the tests.
          dir=$(cygpath -w "$RUNNER_TEMP")
          ci/fetch-msb.sh "$(cygpath -u "$RUNNER_TEMP")/msb"
          echo "PUDDLE_VM_RUNTIME_DIR=$dir\\msb" >> "$GITHUB_ENV"
          echo "PUDDLE_VM_ROOT=$dir\\pvm" >> "$GITHUB_ENV"
      - name: guest agent (static musl build)
        if: steps.whp.outputs.ok == 'true'
        shell: bash
        run: echo "PUDDLE_AGENT_BIN=$(cygpath -w "$PWD/$(ci/build-agent.sh --locked)")" >> "$GITHUB_ENV"
      - name: build the VM tests
        if: steps.whp.outputs.ok == 'true'
        shell: bash
        run: cargo nextest run $VM_CRATES --profile vm --locked --no-run
      - name: VM tests (tier W)
        if: steps.whp.outputs.ok == 'true'
        # ~40 VM tests since T-106 (contract suite, adapter bars, boot hook).
        timeout-minutes: 30
        shell: bash
        run: |
          # Laptop-only tests (vm_laptop_*) run in ci/windows-e2e.ps1, not here.
          PUDDLE_VM_PREFIX="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            cargo nextest run $VM_CRATES --profile vm --locked \
            -E 'not test(/(^|::)vm_laptop_/)'
      - name: upload test results and msb logs
        if: ${{ !cancelled() && steps.whp.outputs.ok == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-windows-results
          path: |
            target/nextest/vm/junit.xml
            ${{ runner.temp }}/pvm/**/logs/**
          retention-days: 14
          if-no-files-found: ignore
