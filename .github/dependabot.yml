# Weekly, grouped into one PR per ecosystem to save CI minutes. PRs go to develop.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # CI and engines pin Node 24; @types/node majors above it describe APIs the runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /crates/puddle-api/openapi
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      openapi-codegen:
        patterns: ["*"]
