# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-deny: licences, advisories, bans, sources. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound) fails the check, as does a
# yanked crate. An exception goes in `ignore` with the advisory ID, a reason and a review date.
yanked = "deny"
unmaintained = "all"
ignore = [
    # Unmaintained, not vulnerable: bincode 2 comes in through the msb SDK (fork tag
    # v0.7.7-puddle.8: microsandbox-filesystem, msb_krun). Still there at T-164; review at each
    # fork bump (T-118), by 2027-01-06.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; transitive via the pinned msb SDK" },
    # rsa timing side channel (Marvin), no fixed release. Comes in through the SDK's `ssh` feature
    # (russh, ssh-key). puddle's SSH server listens only on an owner-only local pipe/socket (T-105)
    # with an ed25519 host key; the attack needs remote timing observation. T-106; review with
    # T-114 (SSH endpoint) and at each SDK/fork bump, by 2027-01-06.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack; transitive via the msb SDK's russh, local-only SSH" },
]

[licenses]
# Licences that may be combined into a GPL-3.0-or-later program. Anything else fails until
# reviewed. GPL-2.0-only, AGPL, EPL, CDDL, SSPL and similar are deliberately absent.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "LGPL-3.0-only",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are `publish = false`; they are GPL-3.0-or-later (checked by the SPDX gate).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# puddle's own forks (D-53), and only these repositories: the msb SDK at its fork tag, and the
# libkrun and russh forks that the msb fork patches in (repeated in puddle's `[patch.crates-io]`).
# Not `allow-org`: a new repository under TijsVK must be added here on purpose.
allow-git = [
    "https://github.com/TijsVK/microsandbox",
    "https://github.com/TijsVK/libkrun",
    "https://github.com/TijsVK/russh",
]
