# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-deny: licences, advisories, bans, sources. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound) fails the check, as does a
# yanked crate. An exception goes in `ignore` with the advisory ID, a reason and a review date.
yanked = "deny"
unmaintained = "all"
ignore = [
    # Unmaintained, not vulnerable: bincode 2 comes in through the msb SDK `=0.7.7`
    # (microsandbox-filesystem, msb_krun). Review at each SDK/fork bump (T-117, T-118), by 2027-01-06.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; transitive via the pinned msb SDK" },
]

[licenses]
# Licences that may be combined into a GPL-3.0-or-later program. Anything else fails until
# reviewed. GPL-2.0-only, AGPL, EPL, CDDL, SSPL and similar are deliberately absent.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "LGPL-3.0-only",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are `publish = false`; they are GPL-3.0-or-later (checked by the SPDX gate).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# puddle's own forks (msb, libkrun) become git dependencies (D-53): add
# `allow-org = { github = ["TijsVK"] }` with the first one (left out now: unused entries warn).
